name: tests

# Run the test suite on pushes and pull requests to the main branch.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The core needs numpy and scipy only, both ordinary dependencies, so
      # the test extra adds just pytest. The two panel test files skip
      # themselves here: they importorskip panel and bokeh, which belong to
      # the `demo` extra and are only installed where the browser demo is
      # built. Everything that is physics runs.
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -v

      - name: Confirm the core pulls nothing beyond numpy and scipy
        run: |
          python - <<'PY'
          import sys
          before = set(sys.modules)
          import drlp.longprofile  # noqa: F401
          heavy = {"networkx", "matplotlib", "pandas", "panel", "bokeh"}
          pulled = {m.split(".")[0] for m in set(sys.modules) - before} & heavy
          assert not pulled, f"the core imported {sorted(pulled)}"
          print("core imports clean")
          PY
